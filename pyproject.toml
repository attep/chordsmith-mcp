[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chordsmith-mcp"
version = "0.5.1"
description = "MCP server that turns chord progressions into MIDI files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.30,<2",
    "mido>=1.3,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
diffsinger = ["onnxruntime>=1.17,<2", "onnx>=1.16,<2", "numpy>=1.26", "PyYAML>=6", "cmudict>=1.0"]

[project.scripts]
chordsmith-mcp = "chordsmith.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chordsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
