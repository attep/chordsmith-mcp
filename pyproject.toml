[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chordsmith-mcp"
version = "0.29.0"
description = "MCP server that turns chord progressions into MIDI files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.30,<2",
    "mido>=1.3,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "anyio>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
diffsinger = ["onnxruntime>=1.17,<2", "onnx>=1.16,<2", "numpy>=1.26", "PyYAML>=6", "cmudict>=1.0"]

[project.scripts]
chordsmith-mcp = "chordsmith.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chordsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Typing is checked where it is already clean; the file list grows as modules get there.
# The pydantic plugin understands model defaults, so field-less constructions check correctly.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = [
    "src/chordsmith/analysis.py",
    "src/chordsmith/audio.py",
    "src/chordsmith/auth.py",
    "src/chordsmith/delivery.py",
    "src/chordsmith/forms.py",
    "src/chordsmith/grooves.py",
    "src/chordsmith/harmony.py",
    "src/chordsmith/midi_writer.py",
    "src/chordsmith/mixjobs.py",
    "src/chordsmith/models.py",
    "src/chordsmith/offload.py",
    "src/chordsmith/ratelimit.py",
    "src/chordsmith/renderjobs.py",
    "src/chordsmith/sections.py",
    "src/chordsmith/soundfont.py",
    "src/chordsmith/storage.py",
    "src/chordsmith/tabs.py",
    "src/chordsmith/theory.py",
]
